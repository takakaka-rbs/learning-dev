version: 2

updates:
  # ─────────────────────────────────────────
  # フロントエンド (npm)
  # ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - frontend
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-router"
          - "pinia"
          - "@vitejs/plugin-vue"
          - "vue-tsc"
        update-types:
          - minor
          - patch
      hey-api:
        patterns:
          - "@hey-api/*"
        update-types:
          - minor
          - patch

  # ─────────────────────────────────────────
  # バックエンド (Maven)
  # ─────────────────────────────────────────
  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - backend
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
        update-types:
          - minor
          - patch
      jooq:
        patterns:
          - "org.jooq:*"
        update-types:
          - minor
          - patch

  # ─────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns:
          - "actions/*"
          - "docker/*"
        update-types:
          - minor
          - patch
