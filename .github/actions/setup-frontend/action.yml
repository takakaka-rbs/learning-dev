name: Setup Frontend
description: Node.jsセットアップ・依存インストール・APIクライアント生成をまとめた composite action

inputs:
  generate-api:
    description: APIクライアントを生成するか（lint・testでは必要、security では不要）
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Generate API client
      if: inputs.generate-api == 'true'
      shell: bash
      working-directory: frontend
      run: npm run generate:api
