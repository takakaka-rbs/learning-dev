name: Release

# dev → main へのマージ時に実行
# 正式版 (1.1.0) を生成して本番環境へデプロイする想定
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  # ──────────────────────────────────────────
  # ① セキュリティ・Lint・テスト（共通）
  # ──────────────────────────────────────────
  checks:
    name: Checks
    uses: ./.github/workflows/_reusable-checks.yml

  # ──────────────────────────────────────────
  # ② 正式バージョニング
  #    タグ例: v1.1.0
  #    dev のプレリリースタグ (v1.1.0-dev.x) を正式版に昇格させる
  # ──────────────────────────────────────────
  versioning:
    name: Versioning (release)
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          major_string_token: "feat!,fix!,refactor!"
          minor_string_token: "feat"
          patch_string_token: "fix,perf,refactor"
          tag_prefix: "v"
          default_bump: patch
          # main では pre_release_branches を指定しない → 正式版タグになる

  # ──────────────────────────────────────────
  # ③ Dockerイメージ ビルド & push
  #    バージョンタグ + latest の両方を付ける
  #    タグ例: 1.1.0, latest
  # ──────────────────────────────────────────
  build-and-push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # 正式版なので latest も付ける
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.versioning.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.versioning.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # ④ JARファイルを GitHub Packages (Maven) へ publish
  # ──────────────────────────────────────────
  publish-jar:
    name: Publish JAR
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set version in pom.xml
        working-directory: backend
        run: |
          mvn versions:set \
            -DnewVersion=${{ needs.versioning.outputs.version }} \
            --no-transfer-progress

      - name: Publish to GitHub Packages
        working-directory: backend
        run: |
          mvn deploy \
            -DskipTests \
            --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────
  # ⑤ npm パッケージを GitHub Packages (npm) へ publish
  # ──────────────────────────────────────────
  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Set package name and version
        working-directory: frontend
        run: |
          # package.json の name と version を動的に書き換える
          # name: @org/frontend の形式に設定（GitHub Packages の要件）
          # version: conventional commits から決定したバージョンを設定
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend';
            pkg.version = '${{ needs.versioning.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        working-directory: frontend
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────
  # ⑥ GitHub Release を作成
  #    リリースノートをコミット履歴から自動生成
  # ──────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - versioning
      - build-and-push-images
      - publish-jar
      - publish-npm
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.versioning.outputs.version }}
          name: v${{ needs.versioning.outputs.version }}
          # コミット履歴からリリースノートを自動生成
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
