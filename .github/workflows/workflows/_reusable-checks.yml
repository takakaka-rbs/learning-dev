name: Reusable Checks

on:
  workflow_call:

jobs:
  # ──────────────────────────────────────────
  # ① セキュリティチェック
  # ──────────────────────────────────────────
  security-frontend:
    name: Security / Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend
        with:
          generate-api: "false"   # セキュリティチェックにAPIクライアント生成は不要

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  security-backend:
    name: Security / Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: OWASP Dependency Check
        working-directory: backend
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            --no-transfer-progress || true

  # ──────────────────────────────────────────
  # ② 静的解析
  # ──────────────────────────────────────────
  lint-frontend:
    name: Lint / Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend   # node install + generate:api

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  lint-backend:
    name: Lint / Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend    # java + maven

      - name: Checkstyle
        working-directory: backend
        run: mvn checkstyle:check --no-transfer-progress

  # ──────────────────────────────────────────
  # ③ テスト
  # ──────────────────────────────────────────
  test-frontend:
    name: Test / Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend   # node install + generate:api

      - name: Run tests
        working-directory: frontend
        run: npm run test --if-present

  test-backend:
    name: Test / Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend    # java + maven

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: appdb
          DB_USER: appuser
          DB_PASSWORD: apppassword
        run: mvn test --no-transfer-progress
