name: Release (dev)

# feat → dev へのマージ時に実行
# プレリリース版 (1.1.0-dev.1) を生成して開発環境へデプロイする想定
on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  # ──────────────────────────────────────────
  # ① セキュリティ・Lint・テスト（共通）
  # ──────────────────────────────────────────
  checks:
    name: Checks
    uses: ./.github/workflows/_reusable-checks.yml
    with:
      fail-on-audit: false

  # ──────────────────────────────────────────
  # ② プレリリースバージョニング
  #    タグ例: v1.1.0-dev.1, v1.1.0-dev.2, ...
  #    mainのタグ (v1.1.0) とは別管理
  # ──────────────────────────────────────────
  versioning:
    name: Versioning (pre-release)
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next pre-release version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          major_string_token: "feat!,fix!,refactor!"
          minor_string_token: "feat"
          patch_string_token: "fix,perf,refactor"
          tag_prefix: "v"
          default_bump: patch
          # プレリリースサフィックスを付ける: 1.1.0-dev.1
          pre_release_branches: "dev"
          append_to_pre_release_tag: "dev"

  # ──────────────────────────────────────────
  # ③ Dockerイメージ ビルド & push
  #    latest タグは付けない（本番と区別するため）
  #    タグ例: 1.1.0-dev.1
  # ──────────────────────────────────────────
  build-and-push-images:
    name: Build & Push Images (dev)
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # latest は付けない
          tags: ${{ env.FRONTEND_IMAGE }}:${{ needs.versioning.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ needs.versioning.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # ④ JARファイルを GitHub Packages (Maven) へ publish
  #    自作ライブラリを他プロジェクトから参照する用途
  # ──────────────────────────────────────────
  publish-jar:
    name: Publish JAR (dev)
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set version in pom.xml
        working-directory: backend
        run: |
          mvn versions:set \
            -DnewVersion=${{ needs.versioning.outputs.version }} \
            --no-transfer-progress

      - name: Publish to GitHub Packages
        working-directory: backend
        run: |
          mvn deploy \
            -DskipTests \
            --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────
  # ⑤ npm パッケージを GitHub Packages (npm) へ publish
  #    自作フロントライブラリを他プロジェクトから参照する用途
  # ──────────────────────────────────────────
  publish-npm:
    name: Publish npm (dev)
    runs-on: ubuntu-latest
    needs: versioning
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Set package name and version
        working-directory: frontend
        run: |
          # package.json の name と version を動的に書き換える
          # name: @org/frontend の形式に設定（GitHub Packages の要件）
          # version: conventional commits から決定したバージョンを設定
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend';
            pkg.version = '${{ needs.versioning.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        working-directory: frontend
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
