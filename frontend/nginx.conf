server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPAのルーティング対応
    location / {
        try_files $uri $uri/ /index.html;
    }

    # APIへのプロキシ（本番環境ではロードバランサー側で設定する想定）
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    # }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
